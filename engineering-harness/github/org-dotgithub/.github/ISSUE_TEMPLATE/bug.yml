name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: local / dit1 / dit2 / qa / uat / prod
  - type: markdown
    attributes:
      value: "Do not paste secrets, personal data, or production records. If this may be a security issue, stop and follow SECURITY.md."
