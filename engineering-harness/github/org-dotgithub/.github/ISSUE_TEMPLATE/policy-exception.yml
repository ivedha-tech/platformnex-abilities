name: Policy exception
description: Request a time-limited exception to a policy
labels: ["policy-exception"]
body:
  - type: input
    id: policy
    attributes:
      label: Policy and rule
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the rule cannot be met
    validations:
      required: true
  - type: textarea
    id: control
    attributes:
      label: Compensating control
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Expiry date (90 days maximum)
    validations:
      required: true
