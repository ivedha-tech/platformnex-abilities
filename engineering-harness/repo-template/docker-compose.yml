# Local development. Synthetic data only.
services:
  app:
    build: .
    env_file: [.env]
    environment:
      PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./src:/src:ro"]
    command: ["sh", "-c", "exec uvicorn app.main:app --app-dir /src --host 0.0.0.0 --port 8080 --reload"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Add local stand-ins for cloud dependencies here, for example:
  # firestore:
  #   image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
  #   command: gcloud emulators firestore start --host-port=0.0.0.0:8081
