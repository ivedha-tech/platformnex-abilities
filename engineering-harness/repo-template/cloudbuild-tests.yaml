# Test-only build, started by PlatformNEX TestOps at a commit (daily on main, and
# on demand for a pull request). It reports a "PlatformNEX tests" status.
# It must never build or push an image, deploy, or open a GitOps pull request:
# the build and release pipeline (cloudbuild.yaml) is generated by PlatformNEX.
#
# Cloud Build uploads `artifacts:` only when every step succeeds, and a failure is
# exactly when the results matter. So each step records its exit code, the JUnit
# files are uploaded, and only then does the build fail.
# Tool images are pinned by tag; mirror them into Artifact Registry and pin by
# digest when you harden further.
steps:
  - id: lint-and-test
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p /workspace/results
        pip install --quiet --root-user-action=ignore -e '.[dev]' || { echo setup > /workspace/failed; exit 0; }
        make lint || echo lint >> /workspace/failed
        pytest --junitxml=/workspace/results/junit.xml || echo tests >> /workspace/failed

  - id: dependency-audit
    name: python:3.12
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        pip install --quiet --root-user-action=ignore . pip-audit && pip-audit --local \
          || echo dependency-audit >> /workspace/failed

  - id: secret-scan
    name: ghcr.io/gitleaks/gitleaks:v8.21.2
    waitFor: ['-']
    entrypoint: sh
    args: ['-c', 'gitleaks dir --redact --no-banner . || echo secret-scan >> /workspace/failed']

  - id: config-scan
    name: aquasec/trivy:0.58.1
    waitFor: ['-']
    entrypoint: sh
    args: ['-c', 'trivy config --exit-code 1 --severity HIGH,CRITICAL . || echo config-scan >> /workspace/failed']

  - id: gates
    name: python:3.12
    waitFor: ['-']
    entrypoint: bash
    args: ['-c', 'bash scripts/check-gates.sh || echo gates >> /workspace/failed']

  - id: publish
    name: gcr.io/cloud-builders/gsutil
    waitFor: [lint-and-test, dependency-audit, secret-scan, config-scan, gates]
    entrypoint: bash
    args:
      - -c
      - |
        ls /workspace/results/* >/dev/null 2>&1 || exit 0
        gsutil -m cp -r /workspace/results/* "gs://${_TEST_RESULTS_BUCKET}/test-results/$BUILD_ID/"

  - id: verdict
    name: bash
    waitFor: [publish]
    args:
      - -c
      - |
        if [ -s /workspace/failed ]; then echo "Failed: $(tr '\n' ' ' < /workspace/failed)"; exit 1; fi
        echo "All checks passed."

substitutions:
  _TEST_RESULTS_BUCKET: set-in-the-trigger
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
